<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 12px; width: 254px; }
  h1 { font-size: 13px; margin: 0 0 8px; }
  button { display: block; width: 100%; margin: 0 0 6px; padding: 7px 8px; font-size: 13px; cursor: pointer; }
  button.primary { background: #e8112d; border: 1px solid #a8081c; color: #fff; font-weight: 600; padding: 9px 8px; }
  button.primary:hover { background: #c60d26; }
  #diag { margin: 8px 0 0; padding: 7px; background: #f4f4f5; border-radius: 4px;
          font: 11px/1.45 Consolas, monospace; white-space: pre-wrap; word-break: break-all; color: #333; }
  .hint { margin: 8px 0 0; font-size: 11px; color: #666; }
</style>
</head>
<body>
  <h1>关闭右侧标签页</h1>
  <button id="btn-right" class="primary">✕ 关闭右侧标签页</button>
  <button id="btn-others">关闭其他标签页</button>
  <button id="btn-left">关闭左侧标签页</button>
  <p class="hint">本图标可以固定到地址栏右边：点地址栏右侧的拼图 → 找到「关闭右侧标签页」→ 点图钉 📌。</p>
  <pre id="diag">诊断载入中…</pre>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
